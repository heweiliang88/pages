name: Deploy Release Zip to Cloudflare Pages

# 触发条件
on:
  release:
    types: [published] # 自动触发：当发布新的 Release 时执行
  workflow_dispatch: # 手动触发配置
    inputs:
      tag_name:
        description: '要部署的 Release 标签名 (如 v1.0.0)。留空则默认拉取最新版本'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # 1. 检出当前仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 使用 GitHub CLI 下载 Release 中的 page.zip 并解压
      - name: Download and Unzip page.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 判断是手动触发还是自动触发，并执行对应的下载逻辑
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag_name }}" ]; then
              echo "手动触发：下载指定标签 ${{ inputs.tag_name }} 的 page.zip"
              gh release download ${{ inputs.tag_name }} -p "page.zip"
            else
              echo "手动触发：未指定标签，正在下载最新 Release 的 page.zip"
              # 不加标签名，gh cli 默认拉取 latest
              gh release download -p "page.zip"
            fi
          else
            echo "自动触发：下载当前发布标签 ${{ github.event.release.tag_name }} 的 page.zip"
            gh release download ${{ github.event.release.tag_name }} -p "page.zip"
          fi
          
          # 创建存放解压文件的目录
          mkdir dist
          
          # 解压 zip 文件到 dist 目录 (已修正此处大小写，统一使用 page.zip)
          unzip page.zip -d dist

      # 3. 部署解压后的文件夹到 Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'pages' # 确保这与你 Cloudflare Pages 的项目名完全一致
          directory: 'dist' 
          branch: 'main' 
